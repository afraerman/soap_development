name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} – ${{ matrix.gui && 'GUI' || 'Console' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        gui: [false, true]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Dependencies – Linux
      # ------------------------------------------------------------------
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ \
            libjsoncpp-dev \
            libhdf5-dev

      - name: Install Qt (Linux, GUI only)
        if: runner.os == 'Linux' && matrix.gui
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          cache: true
          set-env: true

      # ------------------------------------------------------------------
      # Dependencies – Windows
      # ------------------------------------------------------------------
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
        shell: pwsh

      - name: Bootstrap vcpkg and install packages (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "${{ github.worksapce }}/vcpkg"
          cd "${{ github.workspace }}/vcpkg"
          .\bootstrap-vcpkg.bat
          .\vcpkg install jsoncpp:x64-windows hdf5:x64-windows
          echo "VCPKG_ROOT=$pwd" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Install Qt (Windows, GUI only)
        if: runner.os == 'Windows' && matrix.gui
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          set-env: true

      # Load MSVC environment (cl.exe, link.exe, etc.)
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ------------------------------------------------------------------
      # Configure & Build
      # ------------------------------------------------------------------
      - name: Configure CMake
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSOAP_BUILD_GUI=${{ matrix.gui && 'ON' || 'OFF' }} \
              -DSM3D_ENABLE_CUDA=OFF \
              -DSM3D_ENABLE_OPTIX=OFF \
              -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
              ${{ matrix.gui && format('-DCMAKE_PREFIX_PATH={0}', env.Qt6_DIR) || '' }}
          else
            cmake -B build \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DSOAP_BUILD_GUI=${{ matrix.gui && 'ON' || 'OFF' }} \
              -DSM3D_ENABLE_CUDA=OFF \
              -DSM3D_ENABLE_OPTIX=OFF \
              ${{ matrix.gui && format('-DCMAKE_PREFIX_PATH={0}', env.Qt6_DIR) || '' }}
          fi
        shell: bash

      - name: Build
        run: cmake --build build --config Release --parallel
        shell: bash

      # ------------------------------------------------------------------
      # Package
      # ------------------------------------------------------------------
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          VARIANT="${{ matrix.gui && 'gui' || 'console' }}"
          cp build/soap "dist/soap-linux-${VARIANT}"
          echo "SOAP ${VARIANT} build for Linux (tag ${{ github.ref_name }})" > dist/README.txt
          cd dist
          zip -r "../soap-linux-${VARIANT}.zip" .
        shell: bash

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          $variant = if ("${{ matrix.gui }}" -eq "true") { "gui" } else { "console" }
          $exe = "build/soap.exe"
          if (-not (Test-Path $exe)) { $exe = "build/Release/soap.exe" }
          Copy-Item $exe "dist/soap-windows-$variant.exe"
          if ("${{ matrix.gui }}" -eq "true") {
            $dir = Split-Path $exe
            Get-ChildItem $dir -Exclude soap.exe | Copy-Item -Destination dist -Recurse -Force
          }
          Compress-Archive -Path dist\* -DestinationPath "soap-windows-$variant.zip"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: soap-${{ matrix.os }}-${{ matrix.gui && 'gui' || 'console' }}
          path: soap-*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Create the GitHub Release
  # ------------------------------------------------------------------
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SOAP ${{ github.ref_name }}
          body: |
            ## Builds included

            | Platform | Console | GUI |
            |----------|---------|-----|
            | Linux    | ✅      | ✅  |
            | Windows  | ✅      | ✅  |

            ### Notes
            - Console builds do **not** require Qt.
            - GUI builds require the Qt runtime (already bundled for Windows via windeployqt).
            - Large data files (ephemeris `de440.bsp`, EGM2008, etc.) are **not** included – download them separately as described in the README.
          files: artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false